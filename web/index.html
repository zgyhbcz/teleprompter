<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>提词器</title>
<style>
  :root{
    --bg:#0a0a0a; --fg:#f2f2f2; --sub:#8a8a8a; --accent:#e8b64c; --panel:#161616;
    --line:#2a2a2a; --guide:#ff3b30;
  }
  body.theme-black{ --bg:#0a0a0a; --fg:#f2f2f2; --sub:#8a8a8a; }
  body.theme-gray { --bg:#1b1b1b; --fg:#f5f5f5; --sub:#9a9a9a; }
  body.theme-white{ --bg:#ffffff; --fg:#111111; --sub:#777777; --panel:#f1f1f1; --line:#dcdcdc; }
  body.theme-green{ --bg:#00b140; --fg:#ffffff; --sub:#c9f0d6; --panel:#0b8c34; --line:#0a7a2d; }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{
    background:var(--bg); color:var(--fg);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased; user-select:none;
    transition:background .18s ease,color .18s ease;
  }

  /* ============ 控制条 ============ */
  #bar{
    position:fixed; top:0; left:0; right:0; z-index:40;
    display:flex; align-items:center; gap:9px; flex-wrap:wrap;
    padding:6px 11px;
    background:linear-gradient(180deg, rgba(0,0,0,.92), rgba(0,0,0,.72));
    border-bottom:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    font-size:12.5px; color:#ddd;
    transition:transform .22s ease, opacity .22s ease;
  }
  body.theme-white #bar{ background:linear-gradient(180deg,#fafafa,#f0f0f0); border-bottom-color:#ddd; color:#333; }
  body.theme-green #bar{ background:linear-gradient(180deg,#0a7a2d,#0b8c34); color:#eafff1; border-bottom-color:#0a6b28; }
  #bar.hidden{ transform:translateY(-104%); opacity:0; pointer-events:none; }

  .grp{ display:flex; align-items:center; gap:6px; }
  .grp > label{ color:var(--sub); font-size:11.5px; white-space:nowrap; }
  .sep{ width:1px; height:18px; background:var(--line); flex:none; }

  button{
    font-family:inherit; font-size:12.5px; color:inherit;
    background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.14);
    border-radius:7px; padding:4px 9px; cursor:pointer;
    transition:background .14s, border-color .14s, transform .06s;
    white-space:nowrap;
  }
  button:hover{ background:rgba(255,255,255,.18); }
  button:active{ transform:translateY(1px); }
  button.on{ background:var(--accent); border-color:var(--accent); color:#1a1204; font-weight:700; }
  button.primary{ background:var(--accent); border-color:var(--accent); color:#1a1204; font-weight:700; }
  body.theme-white button{ background:rgba(0,0,0,.06); border-color:rgba(0,0,0,.14); color:#222; }
  body.theme-white button.on,body.theme-white button.primary{ background:#d99e2b; color:#fff; border-color:#d99e2b; }

  input[type=range]{
    -webkit-appearance:none; height:4px; border-radius:3px;
    background:rgba(255,255,255,.22); outline:none; cursor:pointer;
  }
  body.theme-white input[type=range]{ background:rgba(0,0,0,.18); }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--accent); cursor:pointer; box-shadow:0 0 0 3px rgba(232,182,76,.18);
  }
  .val{ min-width:32px; text-align:right; color:var(--accent); font-variant-numeric:tabular-nums; font-size:11.5px; }

  /* ============ 舞台 ============ */
  #stage{
    position:fixed; inset:0; overflow:hidden;
    background:var(--bg);
    cursor:default;
  }
  #text{
    position:absolute; top:0; left:50%;
    transform:translate3d(-50%,0,0);
    width:88%; max-width:100%;
    padding:42vh 0 100vh 0;
    font-size:56px; line-height:1.5; font-weight:600;
    letter-spacing:.01em; text-align:left;
    color:var(--fg);
    will-change:transform;
  }
  #text p{ margin:0 0 .55em 0; }
  #text:empty::before{
    content:"点「打开文件」载入配音稿，或点「编辑」直接粘贴文字。\A支持 .docx / .txt / .md";
    white-space:pre-wrap; font-size:26px; font-weight:400; color:var(--sub);
    display:block; text-align:center; line-height:1.9;
  }

  /* 镜像：只镜像文字，不影响控制条 */
  #stage.mirrorH #text{ transform:translate3d(-50%,0,0) scaleX(-1); }
  #stage.mirrorV #text{ transform:translate3d(-50%,0,0) scaleY(-1); }
  #stage.mirrorH.mirrorV #text{ transform:translate3d(-50%,0,0) scaleX(-1) scaleY(-1); }

  /* 导播线 */
  #guide{
    position:fixed; left:0; right:0; top:40%; height:0; z-index:20;
    border-top:2px solid var(--guide); opacity:.75; pointer-events:none;
    box-shadow:0 0 12px rgba(255,59,48,.5);
  }
  #guide::before,#guide::after{
    content:""; position:absolute; top:-7px; width:0; height:0;
    border-top:6px solid transparent; border-bottom:6px solid transparent;
  }
  #guide::before{ left:0; border-left:14px solid var(--guide); }
  #guide::after{ right:0; border-right:14px solid var(--guide); }
  #guide.off{ display:none; }

  /* 进度条 */
  #prog{
    position:fixed; left:0; bottom:0; height:3px; width:0%;
    background:var(--accent); z-index:35; transition:width .1s linear;
    box-shadow:0 0 10px rgba(232,182,76,.6);
  }
  #hud{
    position:fixed; right:16px; bottom:14px; z-index:35;
    font-size:12px; color:var(--sub); font-variant-numeric:tabular-nums;
    background:rgba(0,0,0,.45); padding:3px 9px; border-radius:6px;
    transition:opacity .3s;
  }
  body.theme-white #hud{ background:rgba(0,0,0,.06); }
  #hud.dim{ opacity:0; }

  /* 暂停提示 */
  #paused-tag{
    position:fixed; left:50%; top:16px; transform:translateX(-50%) scale(.9);
    z-index:36; padding:6px 18px; border-radius:20px;
    background:rgba(232,182,76,.16); border:1px solid var(--accent); color:var(--accent);
    font-size:13px; font-weight:700; letter-spacing:.08em;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  #paused-tag.show{ opacity:1; transform:translateX(-50%) scale(1); }

  #toast{
    position:fixed; left:50%; top:58px; transform:translateX(-50%) translateY(-8px);
    z-index:37; padding:7px 20px; border-radius:20px;
    background:rgba(0,0,0,.82); border:1px solid rgba(255,255,255,.22); color:#f0f0f0;
    font-size:13px; opacity:0; pointer-events:none;
    transition:opacity .18s, transform .18s; max-width:70vw;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ============ 抽屉：播放列表 / 帮助 ============ */
  .drawer{
    position:fixed; top:0; bottom:0; left:0; width:330px; z-index:50;
    background:var(--panel); border-right:1px solid var(--line);
    transform:translateX(-102%); transition:transform .22s ease;
    display:flex; flex-direction:column;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer h3{
    font-size:14px; font-weight:700; color:var(--accent);
    padding:16px 18px 10px; letter-spacing:.06em;
  }
  #plist{ flex:1; overflow-y:auto; padding:0 10px 14px; }
  .item{
    display:flex; align-items:center; gap:8px; padding:10px 10px;
    border-radius:8px; cursor:pointer; font-size:13.5px; color:var(--fg);
    border:1px solid transparent; margin-bottom:5px;
  }
  .item:hover{ background:rgba(255,255,255,.06); }
  body.theme-white .item:hover{ background:rgba(0,0,0,.05); }
  .item.active{ background:rgba(232,182,76,.14); border-color:rgba(232,182,76,.5); }
  .item .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .del{ color:var(--sub); font-size:15px; padding:0 4px; border-radius:4px; }
  .item .del:hover{ color:#ff5c5c; background:rgba(255,92,92,.12); }
  .empty{ color:var(--sub); font-size:13px; padding:14px 18px; line-height:1.8; }

  #help{
    position:fixed; inset:0; z-index:60; display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,.72); backdrop-filter:blur(4px);
  }
  #help.open{ display:flex; }
  .helpbox{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:26px 30px; max-width:620px; width:calc(100% - 60px);
    color:var(--fg); font-size:13.5px; line-height:2;
  }
  .helpbox h2{ font-size:17px; color:var(--accent); margin-bottom:14px; letter-spacing:.05em; }
  .helpbox table{ width:100%; border-collapse:collapse; }
  .helpbox td{ padding:4px 0; vertical-align:top; }
  .helpbox td:first-child{ width:150px; }
  kbd{
    display:inline-block; min-width:24px; text-align:center;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2);
    border-bottom-width:2px; border-radius:5px; padding:1px 7px;
    font-family:Consolas,monospace; font-size:12px; color:var(--fg);
  }
  body.theme-white kbd{ background:rgba(0,0,0,.07); border-color:rgba(0,0,0,.15); }
  .tip{ color:var(--sub); font-size:12px; line-height:1.9; margin-top:14px; }

  /* ============ 编辑面板 ============ */
  #editor{
    position:fixed; inset:0; z-index:70; display:none;
    flex-direction:column; background:var(--bg); padding:18px 22px 18px;
  }
  #editor.open{ display:flex; }
  #editor textarea{
    flex:1; width:100%; resize:none; outline:none;
    background:var(--panel); color:var(--fg);
    border:1px solid var(--line); border-radius:10px;
    padding:18px 20px; font-family:inherit; font-size:16px; line-height:1.9;
    user-select:text;
  }
  .erow{ display:flex; align-items:center; gap:10px; padding-top:12px; }
  .erow .sp{ flex:1; }
  .erow .cnt{ color:var(--sub); font-size:12px; }
</style>
</head>
<body class="theme-black">

<div id="bar">
  <div class="grp">
    <button id="btn-open" class="primary">打开</button>
    <button id="btn-edit">编辑</button>
    <button id="btn-list">列表</button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button id="btn-play" class="primary">▶ 开始</button>
    <button id="btn-top">首行</button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <label>速度</label>
    <input type="range" id="r-speed" min="1" max="60" step="1" style="width:78px">
    <span class="val" id="v-speed">1.2×</span>
  </div>
  <div class="grp">
    <label>字号</label>
    <input type="range" id="r-font" min="20" max="140" step="2" style="width:78px">
    <span class="val" id="v-font">56</span>
  </div>
  <div class="grp">
    <label>宽</label>
    <input type="range" id="r-width" min="40" max="100" step="2" style="width:58px">
    <span class="val" id="v-width">88%</span>
  </div>
  <div class="grp">
    <label>行距</label>
    <input type="range" id="r-lh" min="10" max="30" step="1" style="width:58px">
    <span class="val" id="v-lh">1.5</span>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button id="btn-mh">水平镜像</button>
    <button id="btn-mv">垂直镜像</button>
    <button id="btn-guide" class="on">导播线</button>
  </div>
  <div class="sep"></div>
  <div class="grp" style="margin-left:auto">
    <button id="btn-theme">黑色</button>
    <button id="btn-fs">全屏</button>
    <button id="btn-help">帮助</button>
  </div>
</div>

<div id="stage"><div id="text"></div></div>
<div id="guide"></div>
<div id="prog"></div>
<div id="hud">0%</div>
<div id="paused-tag">已暂停</div>
<div id="toast"></div>

<div class="drawer" id="dl">
  <h3>播放列表</h3>
  <div id="plist"></div>
  <div style="padding:0 18px 16px;color:var(--sub);font-size:11.5px;line-height:1.9">
    点击切换 · <kbd>Tab</kbd> 开关 · <kbd>1</kbd>/<kbd>3</kbd> 上下篇
  </div>
</div>

<div id="help">
  <div class="helpbox">
    <h2>快捷键（与遥控器 / 脚踏板一致）</h2>
    <table>
      <tr><td><kbd>空格</kbd></td><td>开始 / 暂停</td></tr>
      <tr><td><kbd>↑</kbd> / <kbd>↓</kbd></td><td>加速 / 减速</td></tr>
      <tr><td><kbd>←</kbd> / <kbd>→</kbd></td><td>向上滚 / 向下滚（手动微调）</td></tr>
      <tr><td><kbd>Home</kbd></td><td>回到首行</td></tr>
      <tr><td><kbd>Tab</kbd></td><td>播放列表</td></tr>
      <tr><td><kbd>1</kbd> / <kbd>3</kbd></td><td>上一篇 / 下一篇</td></tr>
      <tr><td><kbd>2</kbd> / <kbd>F11</kbd></td><td>全屏切换</td></tr>
      <tr><td><kbd>Esc</kbd></td><td>退出全屏 / 关闭面板</td></tr>
      <tr><td><kbd>M</kbd></td><td>水平镜像开关</td></tr>
      <tr><td>鼠标滚轮</td><td>手动上下滚</td></tr>
    </table>
    <div class="tip">
      脚踏板建议在配套软件里把按键设为<b>空格</b>，插上即用，无需安装驱动。<br>
      遥控器按键按上表映射，与原来那套软件的操作习惯保持一致。
    </div>
    <div class="erow"><div class="sp"></div><button id="btn-help-close">知道了</button></div>
  </div>
</div>

<div id="editor">
  <div class="erow" style="padding:0 0 12px">
    <strong style="color:var(--accent)">编辑稿件</strong>
    <span class="sp"></span>
    <span class="cnt" id="edcnt">0 字</span>
  </div>
  <textarea id="edtext" spellcheck="false" placeholder="在此粘贴或输入提词内容……"></textarea>
  <div class="erow">
    <span class="cnt">空行分段，一个空行 = 一个自然段</span>
    <span class="sp"></span>
    <button id="btn-ed-cancel">取消</button>
    <button id="btn-ed-save" class="primary">保存并应用</button>
  </div>
</div>

<input type="file" id="file" accept=".txt,.md,.docx,text/plain" style="display:none">

<script>
"use strict";
/* =========================================================
   提词器 —— 单文件版
   滚屏/镜像/快捷键内核参考 Eyevinn Open Teleprompter (Apache-2.0)
   ========================================================= */

const $ = id => document.getElementById(id);
const stage = $('stage'), textEl = $('text'), guideEl = $('guide');

const S = {
  scripts: [],
  cur: -1,
  playing: false,
  y: 0,              // 当前滚动位移(px)
  maxY: 0,
  speed: 1.2,        // 倍速，1.0 ≈ 100px/s
  font: 56,
  width: 88,
  lh: 1.5,
  mirrorH: false,
  mirrorV: false,
  guide: true,
  theme: 'black',
  barHidden: false
};

const THEMES = ['black','gray','white','green'];
const THEME_CN = { black:'黑色', gray:'深灰', white:'白色', green:'绿幕' };

/* ---------------- 持久化 ---------------- */
function save(){
  try{
    localStorage.setItem('tp.pro.v1', JSON.stringify({
      scripts:S.scripts, cur:S.cur, speed:S.speed, font:S.font,
      width:S.width, lh:S.lh, mirrorH:S.mirrorH, mirrorV:S.mirrorV,
      guide:S.guide, theme:S.theme
    }));
  }catch(e){}
}
function load(){
  try{
    const d = JSON.parse(localStorage.getItem('tp.pro.v1') || 'null');
    if(!d) return false;
    Object.assign(S, {
      scripts:d.scripts||[], cur:(d.cur!==undefined?d.cur:-1),
      speed:d.speed??1.2, font:d.font??56, width:d.width??88, lh:d.lh??1.5,
      mirrorH:!!d.mirrorH, mirrorV:!!d.mirrorV, guide:d.guide!==false, theme:d.theme||'black'
    });
    return true;
  }catch(e){ return false; }
}

/* ---------------- 渲染 ---------------- */
function applyStyle(){
  textEl.style.fontSize = S.font + 'px';
  textEl.style.lineHeight = S.lh;
  textEl.style.width = S.width + '%';
  document.body.className = 'theme-' + S.theme;
  stage.classList.toggle('mirrorH', S.mirrorH);
  stage.classList.toggle('mirrorV', S.mirrorV);
  guideEl.classList.toggle('off', !S.guide);
  $('btn-mh').classList.toggle('on', S.mirrorH);
  $('btn-mv').classList.toggle('on', S.mirrorV);
  $('btn-guide').classList.toggle('on', S.guide);
  $('btn-theme').textContent = THEME_CN[S.theme];
  $('r-speed').value = Math.round(S.speed*10);
  $('v-speed').textContent = S.speed.toFixed(1)+'×';
  $('r-font').value = S.font;  $('v-font').textContent = S.font;
  $('r-width').value = S.width; $('v-width').textContent = S.width+'%';
  $('r-lh').value = Math.round(S.lh*10); $('v-lh').textContent = S.lh.toFixed(1);
}

function renderText(){
  const s = S.scripts[S.cur];
  textEl.innerHTML = s ? s.html : '';
  measure();
  setY(0);
}

function measure(){
  S.maxY = Math.max(0, textEl.scrollHeight - stage.clientHeight);
}

function setY(v){
  S.y = Math.max(0, Math.min(S.maxY, v));
  textEl.style.transform = `translate3d(-50%, ${-S.y}px, 0)` +
    (S.mirrorH ? ' scaleX(-1)' : '') +
    (S.mirrorV ? ' scaleY(-1)' : '');
  updateHud();
}

function updateHud(){
  const p = S.maxY > 0 ? Math.round(S.y / S.maxY * 100) : 0;
  $('prog').style.width = p + '%';
  $('hud').textContent = p + '%';
}

/* ---------------- 滚动引擎 ---------------- */
let rafId = null, lastT = 0;
function loop(t){
  if(!S.playing) return;
  if(!lastT) lastT = t;
  const dt = Math.min(0.05, (t - lastT)/1000);
  lastT = t;
  setY(S.y + 100 * S.speed * dt);
  if(S.y >= S.maxY){ pause(); return; }
  rafId = requestAnimationFrame(loop);
}
function play(){
  if(!S.scripts.length){ toast('先打开一个稿件'); return; }
  if(S.y >= S.maxY) setY(0);
  S.playing = true; lastT = 0;
  $('btn-play').textContent = '⏸ 暂停';
  $('paused-tag').classList.remove('show');
  rafId = requestAnimationFrame(loop);
  requestWakeLock();
}
function pause(){
  S.playing = false;
  if(rafId) cancelAnimationFrame(rafId), rafId = null;
  $('btn-play').textContent = '▶ 开始';
  $('paused-tag').classList.add('show');
  releaseWakeLock();
}
function toggle(){ S.playing ? pause() : play(); }

/* 保持屏幕常亮 */
let wl = null;
async function requestWakeLock(){
  try{ if('wakeLock' in navigator && !wl) wl = await navigator.wakeLock.request('screen'); }catch(e){}
}
function releaseWakeLock(){
  try{ if(wl){ wl.release(); wl = null; } }catch(e){}
}

/* ---------------- 稿件管理 ---------------- */
function addScript(name, html, raw){
  S.scripts.push({ name, html, raw });
  S.cur = S.scripts.length - 1;
  renderText(); renderList(); save();
  pause();
}
function selectScript(i){
  if(i < 0 || i >= S.scripts.length) return;
  S.cur = i; renderText(); renderList(); save();
  pause();
}
function renderList(){
  const box = $('plist');
  if(!S.scripts.length){
    box.innerHTML = '<div class="empty">还没有稿件。<br>点「打开文件」载入 .docx / .txt，<br>或点「编辑」直接粘贴。</div>';
    return;
  }
  box.innerHTML = '';
  S.scripts.forEach((s,i)=>{
    const d = document.createElement('div');
    d.className = 'item' + (i === S.cur ? ' active' : '');
    d.innerHTML = `<span class="nm"></span><span class="del" title="删除">×</span>`;
    d.querySelector('.nm').textContent = (i+1) + '. ' + s.name;
    d.querySelector('.nm').addEventListener('click', ()=>selectScript(i));
    d.querySelector('.del').addEventListener('click', e=>{
      e.stopPropagation();
      S.scripts.splice(i,1);
      if(S.cur >= S.scripts.length) S.cur = S.scripts.length-1;
      renderText(); renderList(); save();
    });
    box.appendChild(d);
  });
}

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function rawToHtml(raw){
  const paras = raw.replace(/\r\n/g,'\n').split(/\n\s*\n/);
  const out = paras.map(p=>{
    const t = p.trim();
    if(!t) return '';
    return '<p>' + esc(t).replace(/\n/g,'<br>') + '</p>';
  }).filter(Boolean);
  return out.length ? out.join('') : '<p>' + esc(raw) + '</p>';
}

/* ---------------- 读文件：txt/md（含 GBK）与 docx ---------------- */
async function readTextFile(buf){
  let txt;
  try{
    txt = new TextDecoder('utf-8', {fatal:true}).decode(buf);
  }catch(e){
    try{ txt = new TextDecoder('gbk').decode(buf); }
    catch(e2){ txt = new TextDecoder('utf-8').decode(buf); }
  }
  return txt.replace(/^\uFEFF/,'');
}

/* docx = zip；用浏览器原生 DecompressionStream 解压，零依赖 */
async function readDocx(buf){
  const dv = new DataView(buf);
  const u8 = new Uint8Array(buf);
  // 找 EOCD
  let eocd = -1;
  for(let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('不是有效的 docx（未找到 zip 目录）');
  const n = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);

  let target = null;
  for(let i = 0; i < n; i++){
    if(dv.getUint32(off, true) !== 0x02014b50) break;
    const method  = dv.getUint16(off + 10, true);
    const csize   = dv.getUint32(off + 20, true);
    const nameLen = dv.getUint16(off + 28, true);
    const extraLen= dv.getUint16(off + 30, true);
    const cmtLen  = dv.getUint16(off + 32, true);
    const lho     = dv.getUint32(off + 42, true);
    const name    = new TextDecoder('utf-8').decode(u8.subarray(off + 46, off + 46 + nameLen));
    if(name === 'word/document.xml'){ target = { method, csize, lho }; break; }
    off += 46 + nameLen + extraLen + cmtLen;
  }
  if(!target) throw new Error('docx 里没有正文');

  // 定位本地文件头后的数据
  const lho = target.lho;
  const nl = dv.getUint16(lho + 26, true);
  const el = dv.getUint16(lho + 28, true);
  const start = lho + 30 + nl + el;
  const data = u8.subarray(start, start + target.csize);

  let xmlBytes;
  if(target.method === 0){
    xmlBytes = data;
  }else{
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([data]).stream().pipeThrough(ds);
    xmlBytes = new Uint8Array(await new Response(stream).arrayBuffer());
  }
  const xml = new TextDecoder('utf-8').decode(xmlBytes);
  return docxXmlToRaw(xml);
}

function docxXmlToRaw(xml){
  // 只取 <w:body> 里的段落，逐段抽 <w:t>
  let body = xml;
  const bm = xml.match(/<w:body[\s\S]*<\/w:body>/);
  if(bm) body = bm[0];
  const paras = body.split(/<w:p[\s>]/).slice(1);
  const lines = paras.map(p=>{
    let s = p;
    // 段内换行 / 制表符
    s = s.replace(/<w:br\b[^>]*\/>/g, '\n').replace(/<w:tab\b[^>]*\/>/g, '\t');
    // 只保留文字节点
    const ts = s.match(/<w:t\b[^>]*>[\s\S]*?<\/w:t>/g) || [];
    let out = ts.map(t=>t.replace(/^<w:t\b[^>]*>/, '').replace(/<\/w:t>$/, '')).join('');
    out = out.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
             .replace(/&apos;/g,"'").replace(/&amp;/g,'&');
    return out;
  });
  // 每个 <w:p> 就是一个自然段：非空段用空行连接，空段落只当间隔丢弃
  const kept = lines.map(l=>l.replace(/[ \t]+$/,'')).filter(l=>l.trim().length>0);
  const text = kept.join('\n\n').trim();
  if(!text) throw new Error('docx 正文为空');
  return text;
}

/* ---------------- 打开文件 ---------------- */
$('file').addEventListener('change', async e=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  try{
    const buf = await f.arrayBuffer();
    const name = f.name.replace(/\.[^.]+$/,'');
    let raw;
    if(/\.docx$/i.test(f.name)) raw = await readDocx(buf);
    else raw = await readTextFile(buf);
    if(!raw.trim()){ toast('文件是空的'); return; }
    addScript(name, rawToHtml(raw), raw);
    toast('已载入：' + f.name);
  }catch(err){
    console.error(err);
    toast('读取失败：' + err.message);
  }
  e.target.value = '';
});

/* ---------------- 编辑 ---------------- */
let editingIdx = -1;
function openEditor(){
  editingIdx = S.cur;
  const s = S.scripts[S.cur];
  $('edtext').value = s ? s.raw : '';
  $('edcnt').textContent = $('edtext').value.replace(/\s/g,'').length + ' 字';
  $('editor').classList.add('open');
  setTimeout(()=>$('edtext').focus(), 60);
  pause();
}
$('edtext').addEventListener('input', ()=>{
  $('edcnt').textContent = $('edtext').value.replace(/\s/g,'').length + ' 字';
});
$('btn-ed-cancel').onclick = ()=>$('editor').classList.remove('open');
$('btn-ed-save').onclick = ()=>{
  const raw = $('edtext').value;
  if(editingIdx >= 0 && S.scripts[editingIdx]){
    S.scripts[editingIdx].raw = raw;
    S.scripts[editingIdx].html = rawToHtml(raw);
  }else{
    if(!raw.trim()){ $('editor').classList.remove('open'); return; }
    S.scripts.push({ name:'手动输入 ' + (S.scripts.length+1), html:rawToHtml(raw), raw });
    S.cur = S.scripts.length - 1;
  }
  $('editor').classList.remove('open');
  renderText(); renderList(); save();
};

/* ---------------- 全屏 ---------------- */
function toggleFS(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
  }else{
    document.exitFullscreen();
  }
}
document.addEventListener('fullscreenchange', ()=>{
  if(document.fullscreenElement) hideBar();
  else showBar();
});

function hideBar(){ S.barHidden = true; $('bar').classList.add('hidden'); }
function showBar(){ S.barHidden = false; $('bar').classList.remove('hidden'); }

/* ---------------- 提示 ---------------- */
let toastT = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=>el.classList.remove('show'), 1800);
}

/* ---------------- 事件绑定 ---------------- */
$('btn-open').onclick = ()=>$('file').click();
$('btn-edit').onclick = openEditor;
$('btn-play').onclick = toggle;
$('btn-top').onclick = ()=>{ setY(0); };
$('btn-list').onclick = ()=>$('dl').classList.toggle('open');
$('btn-mh').onclick = ()=>{ S.mirrorH = !S.mirrorH; applyStyle(); setY(S.y); save(); };
$('btn-mv').onclick = ()=>{ S.mirrorV = !S.mirrorV; applyStyle(); setY(S.y); save(); };
$('btn-guide').onclick = ()=>{ S.guide = !S.guide; applyStyle(); save(); };
$('btn-theme').onclick = ()=>{
  S.theme = THEMES[(THEMES.indexOf(S.theme)+1) % THEMES.length];
  applyStyle(); save();
};
$('btn-fs').onclick = toggleFS;
$('btn-help').onclick = ()=>$('help').classList.add('open');
$('btn-help-close').onclick = ()=>$('help').classList.remove('open');
$('help').addEventListener('click', e=>{ if(e.target.id === 'help') $('help').classList.remove('open'); });

$('r-speed').addEventListener('input', e=>{ S.speed = (+e.target.value)/10; applyStyle(); save(); });
$('r-font').addEventListener('input', e=>{ S.font = +e.target.value; applyStyle(); measure(); save(); });
$('r-width').addEventListener('input', e=>{ S.width = +e.target.value; applyStyle(); measure(); save(); });
$('r-lh').addEventListener('input', e=>{ S.lh = (+e.target.value)/10; applyStyle(); measure(); save(); });

/* 鼠标滚轮手动滚 */
stage.addEventListener('wheel', e=>{
  e.preventDefault();
  pause();
  setY(S.y + e.deltaY * 0.7);
}, {passive:false});

/* 点击画面：播放/暂停 */
stage.addEventListener('click', e=>{
  if(e.target === stage || e.target === textEl) toggle();
});

/* 键盘：与遥控器/脚踏板一致 */
document.addEventListener('keydown', e=>{
  if($('editor').classList.contains('open')){
    if(e.key === 'Escape') $('editor').classList.remove('open');
    return;
  }
  if(e.key === 'Tab'){ e.preventDefault(); $('dl').classList.toggle('open'); return; }

  switch(e.key){
    case ' ':
      e.preventDefault(); toggle(); break;
    case 'ArrowUp':
      e.preventDefault(); S.speed = Math.min(6, +(S.speed + 0.1).toFixed(1)); applyStyle(); save(); break;
    case 'ArrowDown':
      e.preventDefault(); S.speed = Math.max(0.1, +(S.speed - 0.1).toFixed(1)); applyStyle(); save(); break;
    case 'ArrowLeft':
      e.preventDefault(); pause(); setY(S.y - 60); break;
    case 'ArrowRight':
      e.preventDefault(); pause(); setY(S.y + 60); break;
    case 'PageUp':
      e.preventDefault(); pause(); setY(S.y - stage.clientHeight * 0.9); break;
    case 'PageDown':
      e.preventDefault(); pause(); setY(S.y + stage.clientHeight * 0.9); break;
    case 'Home':
      e.preventDefault(); setY(0); break;
    case 'End':
      e.preventDefault(); setY(S.maxY); break;
    case 'F11':
      e.preventDefault(); toggleFS(); break;
    case '2':
      e.preventDefault(); toggleFS(); break;
    case '1':
      e.preventDefault(); selectScript(S.cur - 1); break;
    case '3':
      e.preventDefault(); selectScript(S.cur + 1); break;
    case 'm': case 'M':
      S.mirrorH = !S.mirrorH; applyStyle(); setY(S.y); save(); break;
    case 'Escape':
      if($('help').classList.contains('open')) $('help').classList.remove('open');
      else if($('dl').classList.contains('open')) $('dl').classList.remove('open');
      else if(document.fullscreenElement) document.exitFullscreen();
      else S.barHidden ? showBar() : hideBar();
      break;
  }
});

/* 鼠标移到顶部露出控制条 */
document.addEventListener('mousemove', e=>{
  if(e.clientY < 8 && S.barHidden) showBar();
});
window.addEventListener('resize', ()=>{ measure(); setY(S.y); });

/* ---------------- 启动 ---------------- */
(function init(){
  load();
  applyStyle();
  renderList();
  renderText();
  if(!S.scripts.length){
    // 首次运行给一段示例，方便直接试
    const demo = '这是一段示例稿件。\n\n点「打开」可以载入 .docx 或 .txt 稿件，也可以点「编辑」直接粘贴文字。\n\n空格键开始或暂停；↑ 加速，↓ 减速；← → 手动微调；Tab 打开播放列表；2 或 F11 全屏。\n\n分光镜提词器请点「水平镜像」。';
    textEl.innerHTML = rawToHtml(demo);
    measure();
  }else{
    measure();
  }
  setTimeout(measure, 300);
})();
</script>
