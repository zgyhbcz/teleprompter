name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 编译
        shell: pwsh
        run: ./src/build.ps1

      - name: 组装发布包
        shell: pwsh
        run: |
          if (-not (Test-Path dist/TiCi.exe)) { throw "构建产物不存在" }

          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/TiCi.exe package/TiCi.exe
          Copy-Item 说明.txt      package/说明.txt
          Copy-Item LICENSE      package/LICENSE
          Copy-Item NOTICE       package/NOTICE

          $zip = "TiCi-${{ github.ref_name }}-win.zip"
          Compress-Archive -Path package/* -DestinationPath $zip -Force
          "打包完成: $zip ({0:N1} KB)" -f ((Get-Item $zip).Length / 1KB)

      - name: 生成校验值
        shell: pwsh
        run: |
          $lines = foreach ($f in @('dist/TiCi.exe', 'TiCi-${{ github.ref_name }}-win.zip')) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          name: TiCi ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/TiCi.exe
            TiCi-${{ github.ref_name }}-win.zip
            SHA256SUMS.txt
          body: |
            ## 下载

            - `TiCi.exe` —— 单文件绿色版，双击即用（Windows 7 SP1 / 8.1 / 10 / 11）
            - `TiCi-${{ github.ref_name }}-win.zip` —— exe + 说明书 + 许可证
            - `SHA256SUMS.txt` —— 校验值

            ## 系统要求

            Windows 7 SP1 / 8.1 / 10 / 11（32/64 位），需要 .NET Framework 4.0 或更高。
            Windows 10 1809+ 与 Windows 11 已内置；Windows 7 需自行安装 .NET Framework 4.x。

            ## 说明

            首次运行若提示「Windows 已保护你的电脑」，点「更多信息」→「仍要运行」即可。
            详见 [README](https://github.com/${{ github.repository }}/blob/main/README.md)。
