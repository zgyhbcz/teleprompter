name: 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前可以先搜一下 Issue，避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述你的使用场景，比直接给方案更有帮助
      placeholder: 例如：现场录制时我需要随时跳到第 3 段，现在只能一直按着滚。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望的方案
      placeholder: 例如：支持在稿件里加段落标记，按 F3 跳到下一个标记。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代做法
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 提词 / 滚动
        - 排版 / 字号 / 镜像
        - 稿件管理 / 编辑
        - 双屏 / 显示器
        - 脚踏板 / 遥控器 / 快捷键
        - 其他
    validations:
      required: true
